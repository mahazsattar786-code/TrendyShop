<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrendyShop | Online Dropshipping Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <div class="logo">TrendyShop</div>
    <nav>
      <a href="#products">Products</a>
      <button id="cart-btn" class="cart-btn">Cart (<span id="cart-count">0</span>)</button>
    </nav>
  </header>

  <section class="hero">
    <h1>Trending Products Delivered To Your Door</h1>
    <p>Discover top-quality items with fast worldwide shipping.</p>
    <a href="#products" class="cta-btn">Shop Now</a>
  </section>

  <section id="products" class="products-section">
    <h2>Featured Products</h2>
    <div class="product-grid" id="product-grid"></div>
  </section>

  <div id="cart-drawer" class="cart-drawer">
    <div class="cart-header">
      <h3>Your Cart</h3>
      <button id="close-cart" class="close-btn">&times;</button>
    </div>
    <div id="cart-items" class="cart-items"></div>
    <div class="cart-footer">
      <p>Total: $<span id="cart-total">0.00</span></p>
      <button class="checkout-btn" onclick="alert('Proceeding to Checkout!')">Checkout</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
